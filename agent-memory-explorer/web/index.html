<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory Explorer</title><link rel="stylesheet" href="/style.css"><body><header><b>✦ MEMORY EXPLORER</b><span>D0 / D1 · 本地记忆工作台</span><em>模型未连接 · 无自动演化</em></header><main><aside><h2>记录一段经历</h2><form id="entry"><label>使用范围<input id="scope" required value="personal" maxlength="80"></label><label>模块（逗号分隔，可多选）<input id="modules" placeholder="学习,项目"></label><label>经历原文<textarea id="body" required maxlength="20000" placeholder="从你亲自输入的第一条经历开始…"></textarea></label><label>数据标识<select id="synthetic"><option value="false">非合成</option><option value="true">合成</option></select></label><button>保存来源</button></form><p id="message" role="status"></p><h3>筛选</h3><label>查看范围<select id="scopeFilter"><option value="">选择范围</option></select></label><label>模块<select id="moduleFilter"><option value="">全部模块</option></select></label><input id="filter" placeholder="范围、模块或正文关键词"><select id="dataFilter"><option value="all">全部数据标识</option><option value="false">非合成</option><option value="true">合成</option></select><h3>记录列表 <small id="count"></small></h3><div id="list"></div></aside><section class="space"><div class="toolbar"><span>星云 · 原始来源</span><button id="reset">重置视角</button><button id="theme">切换主题</button><label><input type="checkbox" id="glow" checked>柔光</label></div><canvas id="sky"></canvas><div class="hint">拖动空白旋转 · 滚轮缩放 · 单击选中 · Shift 拖动节点保存位置<br>距离仅表达布局；光线连接只表示选中记录与原文证据，不代表语义关联。</div><div id="empty">你的记忆空间还是空的<br><small>录入来源后，真实记录将在这里出现。</small></div></section><aside class="detail"><h2>来源与证据</h2><div id="detail">选择一个星点或列表记录，查看原文及版本。</div></aside></main><script src="/app.js"></script></body></html>
